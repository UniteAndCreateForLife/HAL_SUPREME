name: HAL Capture 0.4 Build and Demo

on:
  workflow_dispatch:
  push:
    branches: [hal-capture-native-v1]
    paths:
      - 'active_projects/HAL_CAPTURE_V04_DEMO/**'
      - '.github/workflows/hal-capture-demo.yml'

permissions:
  contents: read

concurrency:
  group: hal-capture-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-demonstrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare tools and source
        run: |
          python -m pip install --user PyYAML
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python active_projects/HAL_CAPTURE_V04_DEMO/prepare.py
          python active_projects/HAL_CAPTURE_V04_DEMO/harden.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-read-only: false
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build, unit tests and Android lint
        id: build
        working-directory: active_projects/HAL_CAPTURE_ANDROID
        run: gradle :app:assembleDebug :playbacklab:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace
      - name: Package build receipts and source
        if: always()
        run: |
          mkdir -p build-delivery
          python - <<'PY'
          from pathlib import Path
          import zipfile, hashlib, json, os
          root = Path('active_projects/HAL_CAPTURE_ANDROID')
          with zipfile.ZipFile('build-delivery/HAL-Capture-0.4.0-source.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if p.is_file() and not any(x in ('build','.gradle','.kotlin') for x in p.relative_to(root).parts) and p.suffix not in ('.jks','.keystore'):
                      z.write(p,p.relative_to(root))
              for p in Path('active_projects/HAL_CAPTURE_V04_DEMO').glob('*'):
                  if p.is_file(): z.write(p,'qa_demo/'+p.name)
          apk = root/'app/build/outputs/apk/debug/app-debug.apk'
          receipt={'commit':os.environ['GITHUB_SHA'], 'physical_device_tested':False, 'store_published':False}
          if apk.is_file():
              data=apk.read_bytes()
              Path('build-delivery/HAL-Capture-Alpha-0.4.0.apk').write_bytes(data)
              receipt.update(apk_sha256=hashlib.sha256(data).hexdigest(),apk_bytes=len(data))
          Path('build-delivery/build-receipt.json').write_text(json.dumps(receipt,indent=2))
          PY
      - name: Upload build and static-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hal-capture-0.4-build
          path: |
            build-delivery/
            active_projects/HAL_CAPTURE_ANDROID/app/build/reports/
            active_projects/HAL_CAPTURE_ANDROID/app/build/test-results/
          if-no-files-found: error
          retention-days: 14
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Film and test Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          disk-size: 6000M
          disable-animations: false
          enable-hw-keyboard: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -camera-front none
          script: python active_projects/HAL_CAPTURE_V04_DEMO/run_demo.py
      - name: Upload genuine demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hal-capture-0.4-emulator-evidence
          path: demo-evidence/
          if-no-files-found: warn
          retention-days: 14
