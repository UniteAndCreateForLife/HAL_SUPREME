name: HAL Capture Android Alpha

on:
  workflow_dispatch:
  push:
    branches:
      - hal-capture-native-v1
    paths:
      - 'active_projects/HAL_CAPTURE_ANDROID_BUNDLE/**'
      - 'active_projects/HAL_CAPTURE_ANDROID_OVERRIDE_V2/**'
      - '.github/workflows/hal-capture-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reconstruct audited source bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p active_projects/HAL_CAPTURE_ANDROID
          cat active_projects/HAL_CAPTURE_ANDROID_BUNDLE/part*.b64 | base64 --decode > /tmp/hal-capture-native-v1.tar.gz
          echo "6c4ebb3828b5e1ab7f328a870da05dade3a85b9f3503a642711e41c54697b60b  /tmp/hal-capture-native-v1.tar.gz" | sha256sum --check
          tar -xzf /tmp/hal-capture-native-v1.tar.gz -C active_projects/HAL_CAPTURE_ANDROID

          # Layer the 0.2 native-audio implementation over the audited 0.1 base.
          cat active_projects/HAL_CAPTURE_ANDROID_OVERRIDE_V2/part*.b64 | base64 --decode > /tmp/hal-capture-v2-override.tar.gz
          echo "82b860fc078ff1c30b4905ca50f98eadac905cbe3468f52ad946e657c1982c43  /tmp/hal-capture-v2-override.tar.gz" | sha256sum --check
          tar -xzf /tmp/hal-capture-v2-override.tar.gz -C active_projects/HAL_CAPTURE_ANDROID

          test -f active_projects/HAL_CAPTURE_ANDROID/settings.gradle.kts
          test -f active_projects/HAL_CAPTURE_ANDROID/app/src/main/AndroidManifest.xml

      - name: Apply alpha source fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("active_projects/HAL_CAPTURE_ANDROID")

          p = root / "app/src/main/java/com/halsupreme/capture/MediaTools.java"
          s = p.read_text()
          s = s.replace(
              "                    info.flags = extractor.getSampleFlags();\n                    muxer.writeSampleData(outTrack, buffer, info);",
              "                    int sampleFlags = extractor.getSampleFlags();\n"
              "                    info.flags = 0;\n"
              "                    if ((sampleFlags & MediaExtractor.SAMPLE_FLAG_SYNC) != 0) {\n"
              "                        info.flags |= MediaCodec.BUFFER_FLAG_KEY_FRAME;\n"
              "                    }\n"
              "                    if ((sampleFlags & MediaExtractor.SAMPLE_FLAG_PARTIAL_FRAME) != 0) {\n"
              "                        info.flags |= MediaCodec.BUFFER_FLAG_PARTIAL_FRAME;\n"
              "                    }\n"
              "                    muxer.writeSampleData(outTrack, buffer, info);"
          )
          p.write_text(s)

          p = root / "app/src/main/java/com/halsupreme/capture/MainActivity.java"
          s = p.read_text()
          s = s.replace(
              "        if (Build.VERSION.SDK_INT >= 33) registerReceiver(receiver, f, Context.RECEIVER_NOT_EXPORTED);\n"
              "        else registerReceiver(receiver, f);",
              "        registerReceiver(receiver, f, Context.RECEIVER_NOT_EXPORTED);"
          )
          s = s.replace(
              '                new AlertDialog.Builder(this)\n'
              '                        .setTitle("Microphone not granted")\n'
              '                        .setMessage("This alpha currently records screen + microphone. Grant microphone permission to make a recording, or use Android Settings to enable it later.")\n'
              '                        .setPositiveButton("Settings", (d,w) -> openAppSettings())\n'
              '                        .setNegativeButton("Cancel", null).show();',
              '                new AlertDialog.Builder(this)\n'
              '                        .setTitle("Microphone not granted")\n'
              '                        .setMessage("You can continue with screen-only recording, or open Settings to enable microphone access.")\n'
              '                        .setPositiveButton("Record screen only", (d,w) -> {\n'
              '                            if (micToggle != null) micToggle.setChecked(false);\n'
              '                            launchProjectionConsent();\n'
              '                        })\n'
              '                        .setNeutralButton("Settings", (d,w) -> openAppSettings())\n'
              '                        .setNegativeButton("Cancel", null).show();'
          )
          p.write_text(s)

          p = root / "app/src/main/java/com/halsupreme/capture/MixedAudioEncoder.java"
          s = p.read_text()
          s = s.replace(
              "package com.halsupreme.capture;\n\nimport android.media.AudioAttributes;",
              "package com.halsupreme.capture;\n\nimport android.Manifest;\nimport android.content.Context;\nimport android.content.pm.PackageManager;\nimport android.media.AudioAttributes;"
          )
          s = s.replace(
              "    private final MediaProjection projection;\n",
              "    private final Context context;\n    private final MediaProjection projection;\n"
          )
          s = s.replace(
              "    public MixedAudioEncoder(MediaProjection projection, boolean capturePlayback, boolean captureMic, File outputFile) {\n        this.projection = projection;",
              "    public MixedAudioEncoder(Context context, MediaProjection projection, boolean capturePlayback, boolean captureMic, File outputFile) {\n        this.context = context.getApplicationContext();\n        this.projection = projection;"
          )
          s = s.replace(
              "    private void prepareInputs() {\n",
              "    private void prepareInputs() {\n"
              "        if (context.checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {\n"
              "            throw new SecurityException(\"RECORD_AUDIO permission is required for selected audio capture sources\");\n"
              "        }\n"
          )
          p.write_text(s)

          p = root / "app/src/main/java/com/halsupreme/capture/RecordingService.java"
          s = p.read_text()
          s = s.replace(
              '        nm.notify(NOTIFICATION_ID, buildNotification(paused ? "Recording paused" : "Recording screen + microphone", true));',
              '        String activeText = withMic ? "Recording screen + microphone" : "Recording screen";\n'
              '        nm.notify(NOTIFICATION_ID, buildNotification(paused ? "Recording paused" : activeText, true));'
          )
          p.write_text(s)

          p = root / "gradle.properties"
          p.write_text(p.read_text().replace("android.useAndroidX=false\n", ""))
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build debug APK
        working-directory: active_projects/HAL_CAPTURE_ANDROID
        run: gradle :app:assembleDebug --stacktrace

      - name: Lint
        working-directory: active_projects/HAL_CAPTURE_ANDROID
        run: gradle :app:lintDebug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hal-capture-alpha-0.2-debug
          path: active_projects/HAL_CAPTURE_ANDROID/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
