name: Compute Router CI

on:
  push:
    branches: ["feat/cloudflare-workers-provider"]
    paths:
      - "services/compute_router/**"
      - "tests/test_compute_router.py"
      - ".github/workflows/compute-router.yml"
  pull_request:
    paths:
      - "services/compute_router/**"
      - "tests/test_compute_router.py"
      - ".github/workflows/compute-router.yml"

permissions:
  contents: read

jobs:
  zero-spend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tooling
        run: python -m pip install ruff==0.14.14

      - name: Run compute-router tests
        run: python -m unittest discover -s tests -p 'test_compute_router.py' -v

      - name: Static checks
        run: |
          python -m py_compile services/compute_router/app.py tests/test_compute_router.py
          ruff check services/compute_router tests/test_compute_router.py

      - name: Prove default zero-spend fail-closed state
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p evidence/compute-router-ci
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from services.compute_router.app import build_providers, choose_route

          providers = build_providers()
          for name in ("cloudflare_workers_ai", "modal"):
              assert providers[name]["enabled"] is False
              assert providers[name]["zero_spend_ready"] is False
              assert providers[name]["requires_zero_spend_ready"] is True
          assert choose_route("embeddings", providers) is None
          assert choose_route("scientific_compute", providers) is None
          receipt = {
              "source_sha": os.environ["EXPECTED_SHA"],
              "cloudflare_enabled": providers["cloudflare_workers_ai"]["enabled"],
              "cloudflare_zero_spend_ready": providers["cloudflare_workers_ai"]["zero_spend_ready"],
              "modal_enabled": providers["modal"]["enabled"],
              "modal_zero_spend_ready": providers["modal"]["zero_spend_ready"],
              "external_provider_call": False,
              "compute_credit_award_verified": False,
              "paid": False,
          }
          Path("evidence/compute-router-ci/readiness.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY
          sha256sum evidence/compute-router-ci/readiness.json > evidence/compute-router-ci/SHA256SUMS

      - name: Upload source-bound evidence
        uses: actions/upload-artifact@v4
        with:
          name: compute-router-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/compute-router-ci/
          if-no-files-found: error
          retention-days: 30
