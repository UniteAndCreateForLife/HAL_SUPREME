name: HAL Campus Evidence Desk CI

on:
  push:
    branches:
      - challenge/global-smart-campus-2026
  pull_request:
    paths:
      - 'challenges/global-smart-campus-2026/**'
      - '.github/workflows/smart-campus-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    name: Acceptance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: challenges/global-smart-campus-2026/mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run acceptance tests
        run: python -m unittest -v
      - name: Run deterministic acceptance benchmark
        run: python benchmark_deterministic.py --iterations 1000 --output BENCHMARK_CI_RECEIPT.json
      - name: Validate public Worker syntax
        working-directory: challenges/global-smart-campus-2026
        run: node --check public_demo/src/worker.js
      - name: Verify no obvious secret files are tracked
        shell: python
        run: |
          import pathlib
          banned = {'.env', 'kaggle.json', 'credentials.json'}
          root = pathlib.Path('.').resolve()
          hits = [str(p.relative_to(root)) for p in root.rglob('*') if p.is_file() and p.name.lower() in banned]
          if hits:
              raise SystemExit(f'blocked secret-like files: {hits}')
          print('secret-file gate: PASS')
      - name: Upload benchmark receipt
        uses: actions/upload-artifact@v4
        with:
          name: smart-campus-benchmark-${{ matrix.os }}
          path: challenges/global-smart-campus-2026/mvp/BENCHMARK_CI_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
