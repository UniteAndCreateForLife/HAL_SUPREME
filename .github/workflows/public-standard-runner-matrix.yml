name: Public Standard Runner Matrix

on:
  push:
    branches: ["main"]
    paths:
      - "services/compute_router/**"
      - "tests/test_compute_router.py"
      - ".github/workflows/public-standard-runner-matrix.yml"
      - ".devcontainer/**"
  pull_request:
    paths:
      - "services/compute_router/**"
      - "tests/test_compute_router.py"
      - ".github/workflows/public-standard-runner-matrix.yml"
      - ".devcontainer/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-standard-runners-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compute-router-portability:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: linux-x64
          - runner: ubuntu-24.04-arm
            label: linux-arm64
          - runner: windows-latest
            label: windows-x64
          - runner: macos-latest
            label: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded test tooling
        run: python -m pip install ruff==0.14.14
      - name: Run compute-router unit tests
        run: python -m unittest discover -s tests -p 'test_compute_router.py' -v
      - name: Compile and lint
        run: |
          python -m py_compile services/compute_router/app.py tests/test_compute_router.py
          ruff check services/compute_router tests/test_compute_router.py
      - name: Emit source-bound runner receipt
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUNNER_LABEL: ${{ matrix.label }}
        run: |
          python - <<'PY'
          import json, os, platform, pathlib, sys
          path = pathlib.Path('evidence/public-standard-runners')
          path.mkdir(parents=True, exist_ok=True)
          receipt = {
              'schema': 'hal.public-standard-runner.v1',
              'source_sha': os.environ['SOURCE_SHA'],
              'runner_label': os.environ['RUNNER_LABEL'],
              'platform': platform.platform(),
              'machine': platform.machine(),
              'python': sys.version.split()[0],
              'external_provider_call': False,
              'paid_runner_requested': False,
              'secrets_required': False,
          }
          (path / f"{os.environ['RUNNER_LABEL']}.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8'
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-standard-runner-${{ matrix.label }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/public-standard-runners/${{ matrix.label }}.json
          if-no-files-found: error
          retention-days: 7
