name: Revenue OS CI

on:
  push:
    branches: ["feat/revenue-os-free-control-plane"]
    paths:
      - "services/revenue_os/**"
      - "tests/test_revenue_os.py"
      - ".github/workflows/revenue-os.yml"
  pull_request:
    paths:
      - "services/revenue_os/**"
      - "tests/test_revenue_os.py"
      - ".github/workflows/revenue-os.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q services/revenue_os tests/test_revenue_os.py
      - name: Tests
        run: python -m unittest discover -s tests -p "test_revenue_os.py" -v
